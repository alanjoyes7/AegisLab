name: Validate AegisLab
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm test
      - run: npm run build
  api:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17.4-bookworm
        env:
          POSTGRES_USER: aegislab
          POSTGRES_PASSWORD: aegislab_local
          POSTGRES_DB: aegislab
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U aegislab -d aegislab"
          --health-interval 5s --health-timeout 3s --health-retries 15
      redis:
        image: redis:7.4.2-bookworm
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 15
    env:
      DATABASE_URL: postgresql+psycopg://aegislab:aegislab_local@localhost:5432/aegislab
      REDIS_URL: redis://localhost:6379/0
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt
      - run: ruff check app tests alembic
      - run: mypy app --ignore-missing-imports
      - run: alembic upgrade head
      - run: python -m pytest -q
      - run: python ../../scripts/check_api_integration.py
